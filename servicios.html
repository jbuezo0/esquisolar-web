<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicios | EsquiSolar</title><meta name="description" content="Diseño, instalación, mantenimiento y trámites para sistemas solares."><link rel="icon" href="assets/images/favicon.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/brand.css"></head><body><a class="skip-link" href="#contenido">Ir al contenido</a><div data-header></div><main id="contenido"><section class="page-hero"><div class="container"><span class="eyebrow">Soluciones integrales</span><h1>Servicios solares con acompañamiento técnico</h1><p>Analizamos su necesidad y le orientamos desde el dimensionamiento hasta la puesta en marcha.</p></div></section><section class="section"><div class="container"><div class="grid grid-3" id="services"></div></div></section><section class="about-band"><div class="container"><div><h2>¿Tiene un proyecto especial?</h2><p>Cuéntenos qué necesita y prepararemos una propuesta.</p></div><a class="btn btn-dark" href="contacto.html#cotizacion">Solicitar cotización</a></div></section></main><div data-footer></div><script src="js/app.js"></script><script src="js/carrito.js"></script><script>const services=[['Venta de equipos solares','Productos seleccionados para proyectos residenciales, comerciales y rurales.','Compare opciones con asesoría antes de comprar.'],['Diseño y dimensionamiento','Cálculo según consumo, cargas y horas de operación.','Evite equipos insuficientes o sobredimensionados.'],['Instalación de sistemas','Montaje y puesta en marcha con protecciones apropiadas.','Reciba una solución lista para operar.'],['Sistemas híbridos','Integración de paneles, red y baterías.','Ahorro diario y respaldo durante cortes.'],['Sistemas aislados u off-grid','Energía para sitios sin una red eléctrica estable.','Mayor autonomía en fincas y ubicaciones remotas.'],['Sistemas conectados a la red','Generación para autoconsumo durante el día.','Reduzca compras de energía de la distribuidora.'],['Respaldo con baterías','Selección de baterías y cargas prioritarias.','Mantenga activos equipos esenciales.'],['Bombeo solar','Diseño para pozos, riego y abastecimiento.','Bombee agua aprovechando la energía solar.'],['Mantenimiento y revisión','Diagnóstico y revisión del rendimiento del sistema.','Proteja su inversión y detecte fallas.'],['Ampliación de sistemas','Evaluación para agregar paneles o almacenamiento.','Adapte el sistema a nuevas necesidades.'],['Configuración de inversores','Ajustes de operación y parámetros compatibles.','Mejore el uso de generación y baterías.'],['Trámite de autoproductor','Orientación para contador bidireccional y documentación.','Avance con un proceso más ordenado.']];document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#services').innerHTML=services.map((s,i)=>`<article class="card"><span class="icon">${['☀','📐','🛠','🔋','⌂','⚡','🔌','💧','🔎','＋','⚙','📄'][i]}</span><h3>${s[0]}</h3><p>${s[1]}</p><strong>${s[2]}</strong><div class="actions"><a class="btn btn-green" href="${whatsappUrl('Hola, EsquiSolar. Quiero cotizar el servicio: '+s[0])}" target="_blank" rel="noopener">Cotizar por WhatsApp</a></div></article>`).join('')})</script></body></html>
